<script language="JavaScript" type="text/JavaScript">
function muestra(capa,event,tipo){
  
  var tempX = 0;
  var tempY = 0;
  var desplazamiento=0;
  if (tipo=='fecha')
    desplazamiento=140;
  else desplazamiento=360;
    
  var NAV = navigator.appName;
  if (NAV=="Microsoft Internet Explorer") {
	tempX = event.clientX + document.body.scrollLeft;
    tempY = event.clientY + document.body.scrollTop;
  } else {
    tempX = event.pageX;
    tempY = event.pageY;
  }
  
  if (tempX < 0){tempX = 0;}
  if (tempY < 0){tempY = 0;}
  // alert("xvale:"+tempX+" y vale:"+tempY);
  var tamleft=eval(tempX-desplazamiento)+"px"; 
  var tamtop=tempY+"px";
    
  document.getElementById(capa).style.top = tamtop; // 100px 
  document.getElementById(capa).style.left = tamleft; // 150px
  document.getElementById(capa).style.visibility = "visible";
  document.getElementById(capa).style.position = "absolute";
  document.getElementById(capa).style.zIndex = "auto";
  document.getElementById(capa).style.display = "block";
  if (NAV=="Microsoft Internet Explorer") {
	  document.getElementById(capa).style.width = "350px";
  }
}
function oculta(capa){
 document.getElementById(capa).style.visibility = "hidden";
}
</script>
