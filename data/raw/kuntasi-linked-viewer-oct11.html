    	function compareForSamePage(pageRangePages, selectivePages)
    	{
    		var isSamePage = false;
    		
    		if(pageRangePages != undefined)
    		{
    			for(var i=0;i<pageRangePages.length;i++){
    				
    				var initialPageOfFirstRange;
    				var boundaryPageOfFirstRange;
    				for(var j=0;j<pageRangePages.length;j++)
    				{
    					var position = 0;
    					
    					var boundariesOfFirstPageRange = pageRangePages[i].split("-");
    					var initialPageOfFirstRange = parseInt(boundariesOfFirstPageRange[position]);
    					var boundaryPageOfFirstRange = parseInt(boundariesOfFirstPageRange[position+1]);
    					
    					if(pageRangePages[j] != undefined && i!=j)
    					{
    						var boundariesOfSecondPageRange = pageRangePages[j].split("-");
    						var initialPageOfSecondRange = parseInt(boundariesOfSecondPageRange[position]);
    						var boundaryPageOfSecondRange = parseInt(boundariesOfSecondPageRange[position+1]);
    					
    						if(initialPageOfFirstRange >= initialPageOfSecondRange && initialPageOfFirstRange <= boundaryPageOfSecondRange){
    							isSamePage = true;
    						}
    						else if(boundaryPageOfFirstRange >= initialPageOfSecondRange && boundaryPageOfFirstRange <= boundaryPageOfSecondRange){
    							isSamePage = true;
    						}
    					}
    					if(isSamePage == true)
    						break;	
    				}
    				if(selectivePages != undefined){
    				for(var k=0;k<selectivePages.length;k++){
    						if(selectivePages[k] >= initialPageOfFirstRange &&  selectivePages[k]<= boundaryPageOfFirstRange){
    							isSamePage = true;
    						}
    					}
    				}
    				if(isSamePage == true)
    					break;
    			}
    		}
    		
    		if( selectivePages.length > 1 && selectivePages != undefined && isSamePage == false)
    		{
    			for(var i=0;i<selectivePages.length;i++)
    			{
    				for(j=0;j<selectivePages.length;j++)
    				{
    					if(i != j )
    					{
    						if(selectivePages[i] == selectivePages[j])
    							isSamePage = true;
    					}
    				}
    				if(isSamePage == true)
    					break;
    			}
    		}
    		
    		return isSamePage;
    	}
    	
        function addToListSelectivePages(handle, pages)
        {
			var specificPages = document.getElementById(pages).value;
			var pattern = "^(?=\\d)(((\\,*\\d+)((\\-)(\\d+)){1})|\\,*\\d+)*";
			
			var isInCart = false;
			var pagesOfItemInCart = null;
			
			var isPagesInCart = false;
			
			if(pagesOfItemInCart != null && specificPages == pagesOfItemInCart){
				alert("It seems you are adding same pages again");
				return;
			}
			
			if(specificPages != "")
			{
				if(specificPages.match(pattern) && specificPages.match(pattern)[0] == specificPages)
				{
					var itemMaxPageNumber = "412";
					var position = 0, counter = 0, count = 0;
					
					var pageRangePages = [];
					var selectivePages = [];
					var totalPagesForSingleOrder = [];
					
					var splitPagesOfItem = specificPages.split(",");
					for(var i = 0; i<splitPagesOfItem.length; i++)
					{
						if(splitPagesOfItem[i] == "")
						{
							alert("Selective pages cannot have white spaces");
							return;
						}
						if(splitPagesOfItem[i].includes("-"))
						{
							var pagesInPageRange = splitPagesOfItem[i].split('-');
							var initialPageInPageRange = parseInt(pagesInPageRange[position]);
							var lastPageInPageRange = parseInt(pagesInPageRange[position+1]);
							
							pageRangePages[counter++] = splitPagesOfItem[i];
							
							if(initialPageInPageRange >= lastPageInPageRange){
								alert("Incorrect Page Range.Initial page number must be less than the later.");
								return;
							}
							if(initialPageInPageRange == 0 || lastPageInPageRange == 0){
								alert("Selective pages contain page number 0.\nPlease remove and submit request again");
								return;
								
							}
							if(initialPageInPageRange > itemMaxPageNumber || lastPageInPageRange > itemMaxPageNumber){
								alert("Page Number can not be greater than the max page number.");
								return;
							}
							
							for(var j = initialPageInPageRange; j <= lastPageInPageRange; j++)
							{
								totalPagesForSingleOrder[j] = 1;
							}
							
						}
						else
						{
							var currentPage = parseInt(splitPagesOfItem[i]);
							selectivePages[count++] = splitPagesOfItem[i];
							
							if(currentPage == 0){
								alert("Selective pages contain page number 0.\nPlease remove and submit request again");
								return;
							}
							if(currentPage > itemMaxPageNumber){
								alert("Page Number can not be greater than the max page number.");
								return;
							}
							totalPagesForSingleOrder[currentPage] = 1;
						}
					}
					
					var isSamePage = compareForSamePage(pageRangePages, selectivePages);
					if(isSamePage == true)
					{
						alert("Same Page is Repeated");
						return;
					}
				}
				else
				{
					alert("Please Enter the pages in correct format");
					return;
				}
			}
			else
			{ 
				if(isInCart == true){
					 if(confirm("Remove item with pages from My List ?")){
						 action = "removePages";
						}
				 }
				else
				{
					alert("Please Enter the Page Numbers ");	
					return;
				}
			}
			
			var totalFinalPagesForOrder = 0;
			
			for(var k = 1; (totalPagesForSingleOrder != undefined && k <= totalPagesForSingleOrder.length); k++)
			{
				var currentCounter = totalPagesForSingleOrder[k];
				if(currentCounter == 1)
				{
					totalFinalPagesForOrder++;
				}	
			}
			
			if(totalFinalPagesForOrder > 40)
			{
				alert("You can't order more than 40 pages in single order of same book");
				return;
			}
			
			if(confirm("Add Book with pages in My List ?"))
			{
				action = "addPages";
			}
			
			var options = {
					"pages" : $("#" + pages).val(),
					"handle" : handle,
					"action" : action
			};	
						
			$.ajax({
				type: "POST",
				url: "/jspui/mylist",
				data: options,
				success: function(data){
					if(data != null)
						location.reload();
				}
			});
		}
    </script>

		$("#appliedFilters").val("");
		var filtername = document.getElementById("filtername").value;
		var filtertype = document.getElementById("filtertype").value;
		var filterquery = document.getElementById("filterquery").value;
		if($("#filtername").val() == "date") {
			filterquery = dateValue();
		}
		var apQuery = "";
		var rp = "&query=&sort_by=dc.date.accessioned_dt&order=desc&rpp=20&etal=0" ;
		var baseURL = "/jspui";
		var url = ""; 
		if (selectedFilters != null && selectedFilters.length >1 ) 
		{
			var idx = 1;
			for(var i = 0 ; i<=selectedFilters.length-3;i++ ){
				 apQuery = apQuery +"&filter_field_"+idx+"="+ selectedFilters[i++];
				 apQuery = apQuery +"&filter_type_"+idx+"="+ selectedFilters[i++];
				 apQuery = apQuery +"&filter_value_"+idx+"="+ selectedFilters[i];
				 idx++;
			}
			url = baseURL + "/simple-search?location=" + location + rp;
			if (filterquery == '') {
				url = url + apQuery;
			} else {
				rp = "&filtername=";
				url = url + rp + filtername + "&filtertype=" + filtertype + "&filterquery=" + filterquery + apQuery;
			}
		} else if(selectedFilters.length == 1) {
			rp = "&filtername=";
			url = baseURL + "/simple-search?location=" + location + rp + selectedFilters[0] + "&filtertype=" + selectedFilters[1] + "&filterquery=" + selectedFilters[2] + apQuery;
		} else {
			if ($("#filterquery").val() === '') {
				url = baseURL + "/simple-search?location=" + location + rp;
			} else {
				rp = "&filtername=";
				url = baseURL + "/simple-search?location=" + location + rp + filtername + "&filtertype=" + filtertype + "&filterquery=" + filterquery;
			}
		}
		window.location.assign(url);
	}
	
	function querySearch(){
		var query = $("#query").val();
		if(!query.match("^[a-zA-Z0-9*/: ]*$")){
			alert("Special characters not allowed except *, /, and :");
			event.preventDefault();
			return;
		}
		var encodedQuery = encodeURIComponent(query);
		var baseURL = "/jspui";
		var url = baseURL + "/simple-search?query=" + encodedQuery + "&frontend=frontend&rpp=20&sort_by=score&order=desc";
		
		window.location.assign(url);
	}
	
	function keyupForQuery(e){
		if(e.keyCode == 13){
			querySearch();
		}
	}
</script>
